# YOLO11-RGBT-Victory-Aligned (Target: ~3.8M Params | 12.8 GFLOPs)
# 满足约束：参数量 < 4M | 目标精度：mAP50 > 96%

nc: 1 
ch: 6 

scales: 
  # ?? 黄金宽度因子 0.28 配合 768 基数，将参数量精准锁死在 3.8M 附近
  n: [0.50, 0.25, 1024] 

backbone:
  # --- 0. 输入分流 ---
  - [-1, 1, ChannelSplit, [64]]      # 层 0: [Vis, IR]

  # ================= 可见光支路 (Visible Stream) =================
  - [0, 1, Conv, [64, 3, 2]]          # 层 1: P1-V
  - [-1, 1, Conv, [128, 3, 2]]         # 层 2: P2-V
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 3: P2
  - [-1, 1, Conv, [256, 3, 2]]         # 层 4: P3-V
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 5: P3-V-Out (用于19)
  - [-1, 1, Conv, [512, 3, 2]]         # 层 6: P4-V
  - [-1, 2, C3k2, [512, True]]         # 层 7: P4-V-Out (用于20)
  - [-1, 1, Conv, [768, 3, 2]]         # 层 8: P5-V
  - [-1, 2, C3k2, [768, True]]         # 层 9: P5-V-Out (用于21)

  # ================= 红外光支路 (Infrared Stream) =================
  - [0, 1, Conv, [64, 3, 2]]          # 层 10: P1-I
  - [-1, 1, Conv, [128, 3, 2]]         # 层 11: P2-I
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 12: P2
  - [-1, 1, Conv, [256, 3, 2]]         # 层 13: P3-I
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 14: P3-I-Out (用于19)
  - [-1, 1, Conv, [512, 3, 2]]         # 层 15: P4-I
  - [-1, 2, C3k2, [512, True]]         # 层 16: P4-I-Out (用于20)
  - [-1, 1, Conv, [768, 3, 2]]         # 层 17: P5-I
  - [-1, 2, C3k2, [768, True]]         # 层 18: P5-I-Out (用于21)

  # ================= 核心融合中心 =================
  - [[5, 14], 1, IlluminationAwareWeight, [256]] # 层 19: 融合 P3 (80x80)
  - [[7, 16], 1, CMFF_Module, [512]]             # 层 20: 融合 P4 (40x40)
  - [[9, 18], 1, CMFF_Module, [768]]             # 层 21: 融合 P5 (20x20)

head:
  - [-1, 1, SPPF, [768, 5]]             # 层 22
  - [-1, 2, C2PSA, [768]]               # 层 23
  
  # --- 自上而下路径 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 24
  - [[-1, 20], 1, Concat, [1]]          # 层 25: 结合融合 P4 (层 20)
  - [-1, 2, C3k2, [512, False]]          # 层 26

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 27
  - [[-1, 19], 1, Concat, [1]]          # 层 28: 结合融合 P3 (层 19)
  - [-1, 2, C3k2, [256, False]]          # 层 29: Small Detect (Stride 8)

  # --- 自下而上路径 ---
  - [-1, 1, Conv, [256, 3, 2]]          # 层 30
  - [[-1, 26], 1, Concat, [1]]          # 层 31: 结合层 26
  - [-1, 2, C3k2, [512, False]]          # 层 32: Medium Detect (Stride 16)

  - [-1, 1, Conv, [512, 3, 2]]          # 层 33
  - [[-1, 23], 1, Concat, [1]]          # 层 34: 结合 P5 注意力层 (层 23)
  - [-1, 2, C3k2, [768, True]]           # 层 35: Large Detect (Stride 32)

  - [[29, 32, 35], 1, Detect, [nc]]     # 层 36