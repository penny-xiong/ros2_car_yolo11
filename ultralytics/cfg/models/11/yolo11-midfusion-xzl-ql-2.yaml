# YOLO11-RGBT-SOTA-Journal-Complete-v2 (Target mAP50: 0.98)
nc: 1 
ch: 6 

scales: 
  s: [0.50, 0.50, 1024] # ?? 核心调整 1：将模型规模由 'n' 升级为 's' (Small)，通道数翻倍，彻底提供撑开变形空间所需的表征容量！

backbone:
  - [-1, 1, ChannelSplit, [64]]      # 层 0: [Vis, IR]

  # ================= 可见光支路 =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]    # 层 1: P1-V
  - [-1, 1, Conv, [128, 3, 2]]         # 层 2: P2-V
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 3: P2
  - [-1, 1, Conv, [256, 3, 2]]         # 层 4: P3-V
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 5: P3-V-Out

  # ================= 红外光支路 =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]    # 层 6: P1-I
  - [-1, 1, Conv, [128, 3, 2]]         # 层 7: P2-I
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 8: P2
  - [-1, 1, Conv, [256, 3, 2]]         # 层 9: P3-I
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 10: P3-I-Out

  # ================= 极浅层红外特征清洗立交桥 =================
  - [[3, 8], 1, EarlyModalityGate, [128]] # 层 11: 早期降噪门控维持
  
  # ================= 深度下采样 =================
  - [5, 1, Conv, [512, 3, 2]]          # 层 12: P4-V
  - [-1, 2, C3k2, [512, True]]         # 层 13: P4-V-Out
  - [-1, 1, Conv, [768, 3, 2]]         # 层 14: P5-V
  - [-1, 2, C3k2, [768, True]]         # 层 15: P5-V-Out

  - [10, 1, Conv, [512, 3, 2]]         # 层 16: P4-I
  - [-1, 2, C3k2, [512, True]]         # 层 17: P4-I-Out
  - [-1, 1, Conv, [768, 3, 2]]         # 层 18: P5-I
  - [-1, 2, C3k2, [768, True]]         # 层 19: P5-I-Out

  # ================= 中后期高效轻量融合中心 =================
  - [[5, 10], 1, Concat, [1]]          # 层 20: ?? 核心调整 2：将复杂的 IAW/CMFF 模块还原为标准 Concat
  - [[13, 17], 1, Concat, [1]]          # 层 21: 深度融合直接走高速 Concat，避免浅层稀疏特征在后期非线性窒息！
  - [[15, 19], 1, Concat, [1]]          # 层 22:

head:
  - [-1, 1, SPPF, [768, 5]]              # 层 23
  - [-1, 2, C2PSA, [768]]                # 层 24
  
  # --- Neck 多尺度空间大核注入 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 25
  - [[-1, 21], 1, Concat, [1]]          # 层 26
  - [-1, 2, C3k2_LSK, [512, False]]     # 层 27: 依靠 Neck 端的 LSK 选择性大核完成高质量全局融合！

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 28
  - [[-1, 20], 1, Concat, [1]]          # 层 29
  - [-1, 2, C3k2_LSK, [256, False]]     # 层 30

  - [-1, 1, Conv, [256, 3, 2]]          # 层 31
  - [[-1, 27], 1, Concat, [1]]          # 层 32
  - [-1, 2, C3k2_LSK, [512, False]]     # 层 33

  - [-1, 1, Conv, [512, 3, 2]]          # 层 34
  - [[-1, 24], 1, Concat, [1]]          # 层 35
  - [-1, 2, C3k2_LSK, [768, True]]      # 层 36

  - [[30, 33, 36], 1, Detect, [nc]]     # 层 37