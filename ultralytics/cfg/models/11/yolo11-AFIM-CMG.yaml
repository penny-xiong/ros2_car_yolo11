# YOLO11-RGBT-UBI-AFIM (Target LLVIP mAP50: 0.98+)
# 奶奶的终极破壁版：单向瓶颈注入 (UBI) + 终极光照感知融合 (AFIM) + 标准下采样

nc: 1
ch: 6
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, ChannelSplit, [64]]      # 0: [Vis, IR]

  # ================= 可见光 (Vis) 补给线 =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]  # 1: P1-Vis
  - [-1, 1, Conv, [128, 3, 2]]       # 2: ?? P2-Vis 恢复标准 Conv 下采样
  - [-1, 2, C3k2, [128, False]]      # 3: P2-Vis-out
  - [-1, 1, Conv, [256, 3, 2]]       # 4: ?? P3-Vis 恢复标准 Conv 下采样
  - [-1, 2, C3k2, [256, False]]      # 5: P3-Vis-out

  # ================= 红外 (IR) 主战线 =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]  # 6: P1-IR
  - [-1, 1, Conv, [128, 3, 2]]       # 7: ?? P2-IR 恢复标准 Conv 下采样
  - [-1, 2, C3k2, [128, False]]      # 8: P2-IR-out
  - [-1, 1, Conv, [256, 3, 2]]       # 9: ?? P3-IR 恢复标准 Conv 下采样
  - [-1, 2, C3k2, [256, False]]      # 10: P3-IR-out

  # ================= 第一次单向注入 (P3 级) =================
  - [[5, 10], 1, CMG_Block, [256]]   # 11: ?? Vis 经过瓶颈单向注入 IR
  
  # 分离特征继续前进
  - [11, 1, SelectFromList, [0]]     # 12: 获取未改变的 P3-Vis
  - [-1, 1, Conv, [512, 3, 2]]       # 13: P4-Vis 下采样 
  - [-1, 2, C3k2, [512, True]]       # 14: P4-Vis-out

  - [11, 1, SelectFromList, [1]]     # 15: 获取注入增强后的 P3-IR
  - [-1, 1, Conv, [512, 3, 2]]       # 16: P4-IR 下采样
  - [-1, 2, C3k2, [512, True]]       # 17: P4-IR-out

  # ================= 第二次单向注入 (P4 级) =================
  - [[14, 17], 1, CMG_Block, [512]]  # 18: ?? 再次单向注入
  
  # 走向巅峰 P5
  - [18, 1, SelectFromList, [0]]     # 19: 获取 P4-Vis
  - [-1, 1, Conv, [768, 3, 2]]       # 20: P5-Vis 下采样
  - [-1, 2, C3k2, [768, True]]       # 21: P5-Vis-out

  - [18, 1, SelectFromList, [1]]     # 22: 获取注入增强后的 P4-IR
  - [-1, 1, Conv, [768, 3, 2]]       # 23: P5-IR 下采样
  - [-1, 2, C3k2, [768, True]]       # 24: P5-IR-out

  # ================= 终极决战：AFIM 融合 =================
  - [[12, 15], 1, AFIM, [256]]       # 25: 融合 P3 (Vis + 增强版 IR)
  - [[19, 22], 1, AFIM, [512]]       # 26: 融合 P4 (Vis + 增强版 IR)
  - [[21, 24], 1, AFIM, [768]]       # 27: 融合 P5 (最终决断)

head:
  - [-1, 1, SPPF, [768, 5]]          # 28 (from 27)
  - [-1, 2, C2PSA, [768]]            # 29
  
  # === 自顶向下的 FPN ===
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 30: P5->P4
  - [[-1, 26], 1, Concat, [1]]       # 31: 拼合 AFIM-P4 (层 26)
  - [-1, 2, C3k2_LSK, [512, False]]  # 32

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 33: P4->P3
  - [[-1, 25], 1, Concat, [1]]       # 34: 拼合 AFIM-P3 (层 25)
  - [-1, 2, C3k2_LSK, [256, False]]  # 35: ?? 获得纯净的多尺度 P3 输出

  # === 自底向上的 PAN ===
  - [-1, 1, Conv, [256, 3, 2]]       # 36: 下采样 P3->P4
  - [[-1, 32], 1, Concat, [1]]       # 37: 拼合 FPN 的 P4 (层 32)
  - [-1, 2, C3k2_LSK, [512, False]]  # 38: ?? 获得纯净的多尺度 P4 输出

  - [-1, 1, Conv, [512, 3, 2]]       # 39: 下采样 P4->P5
  - [[-1, 29], 1, Concat, [1]]       # 40: 拼合顶层全局特征 (层 29)
  - [-1, 2, C3k2_LSK, [768, True]]   # 41: ?? 获得纯净的多尺度 P5 输出

  # --- 检测头解耦输出 ---
  - [[35, 38, 41], 1, Detect, [nc]]  # 42: 挂载 P3, P4, P5