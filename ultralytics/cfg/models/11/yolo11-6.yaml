# ==============================================================================
# YOLO11-RGBT: 奶奶的定制版 SOTA 架构
# 核心创新 1: SPDConv (无损特征下采样，保护极暗光下的小目标热源能量)
# 核心创新 2: SIAF_EA (自适应门控特征融合，处理模态对齐与双视差)
# 核心创新 3: C3_LTC (轻量级热力上下文聚合，替换 Neck 层的 C3k2，保护融合后的热力边缘)
# (注: 创新 4 Inner-IoU 在 loss.py 中生效，无需在此配置)
# ==============================================================================

# Parameters
nc: 1  # number of classes (LLVIP: person)
ch: 6  # 6-channel RGBT input (3 for VIS, 3 for IR)

# YOLO11 scales
scales: 
  s: [0.50, 0.50, 1024]

# ==================== BACKBONE (双流特征提取) ====================
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ChannelSplit, [64]]  # [0] 将 6 通道输入一分为二

  # --------- 可见光分支 (VIS Stream) ---------
  - [0, 1, SelectFromList, [0]]       # [1] 选择可见光
  - [-1, 1, Conv, [64, 3, 2]]         # [2] Stem
  - [-1, 1, SPDConv, [128, 3, 2]]     # [3] ??创新1: SPDConv 替换普通 3x3 卷积
  - [-1, 2, C3k2, [128, False, 0.25]] # [4]
  - [-1, 1, Conv, [256, 3, 2]]        # [5] 
  - [-1, 2, C3k2, [256, False, 0.25]] # [6] VIS P3 (浅层特征)
  - [-1, 1, Conv, [512, 3, 2]]        # [7] 
  - [-1, 2, C3k2, [512, True]]        # [8] VIS P4 (中层特征)
  - [-1, 1, Conv, [768, 3, 2]]        # [9] 
  - [-1, 2, C3k2, [768, True]]        # [10] VIS P5 (深层特征)

  # --------- 红外光分支 (IR Stream) ---------
  - [0, 1, SelectFromList, [1]]       # [11] 选择红外光
  - [-1, 1, Conv, [64, 3, 2]]         # [12] Stem
  - [-1, 1, SPDConv, [128, 3, 2]]     # [13] ??创新1: SPDConv 保护红外热能量
  - [-1, 2, C3k2, [128, False, 0.25]] # [14]
  - [-1, 1, Conv, [256, 3, 2]]        # [15] 
  - [-1, 2, C3k2, [256, False, 0.25]] # [16] IR P3 (浅层特征)
  - [-1, 1, Conv, [512, 3, 2]]        # [17] 
  - [-1, 2, C3k2, [512, True]]        # [18] IR P4 (中层特征)
  - [-1, 1, Conv, [768, 3, 2]]        # [19] 
  - [-1, 2, C3k2, [768, True]]        # [20] IR P5 (深层特征)

  # ==================== FUSION (模态动态对齐) ====================
  # ??创新2: SIAF_EA 融合对应尺度的 VIS 和 IR 特征
  - [[6, 16], 1, SIAF_EA, [256]]      # [21] 融合 P3 层
  - [[8, 18], 1, SIAF_EA, [512]]      # [22] 融合 P4 层
  - [[10, 20], 1, SIAF_EA, [768]]     # [23] 融合 P5 层


# ==================== HEAD & NECK (特征金字塔) ====================
head:
  - [23, 1, SPPF, [768, 5]]           # [24]
  - [-1, 2, C2PSA, [768]]             # [25] YOLO11 官方顶部注意力

  # --------- Top-Down (自顶向下特征聚合) ---------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # [26] 恢复官方上采样，拯救 FPS
  - [[-1, 22], 1, Concat, [1]]        # [27] 拼接融合后的 P4
  - [-1, 2, C3_LTC, [512, False]]     # [28] ??创新3: C3_LTC 替换 C3k2，保护边缘不被平滑

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # [29] 
  - [[-1, 21], 1, Concat, [1]]        # [30] 拼接融合后的 P3
  - [-1, 2, C3_LTC, [256, False]]     # [31] ??创新3: C3_LTC 提取小目标边缘 (Det 1: 小目标)

  # --------- Bottom-Up (自底向上特征聚合) ---------
  - [-1, 1, Conv, [256, 3, 2]]        # [32] 降采样
  - [[-1, 28], 1, Concat, [1]]        # [33] 
  - [-1, 2, C3_LTC, [512, False]]     # [34] ??创新3: C3_LTC (Det 2: 中目标)

  - [-1, 1, Conv, [512, 3, 2]]        # [35] 降采样
  - [[-1, 25], 1, Concat, [1]]        # [36] 
  - [-1, 2, C3_LTC, [768, True]]      # [37] ??创新3: C3_LTC (Det 3: 大目标)

  # --------- Detection Head ---------
  - [[31, 34, 37], 1, Detect, [nc]]   # [38] YOLO11 官方端到端/非端到端检测头