# Ultralytics YOLO ??, AGPL-3.0 license
# YOLO11-RGBT-AFIM-SPD (Target LLVIP mAP50: 0.98+)
# Grandma's Inner-IoU Edition: Pure AFIM + Space-to-Depth (无损小目标)

nc: 1
ch: 6
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, ChannelSplit, [64]]      # 0: 切分可见光与红外 [Vis_3ch, IR_3ch]

  # ================= 可见光 (Visible) =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]  # 1: P1-Vis
  - [-1, 1, SPDConv, [128]]          # 2: ?? P2-Vis 无损下采样 (替代原 Conv, stride 2)
  - [-1, 2, C3k2, [128, False, 0.25]]# 3: P2-Vis-out
  - [-1, 1, SPDConv, [256]]          # 4: ?? P3-Vis 无损下采样
  - [-1, 2, C3k2, [256, False, 0.25]]# 5: P3-Vis-out

  # ================= 红外光 (Infrared) =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]  # 6: P1-IR
  - [-1, 1, SPDConv, [128]]          # 7: ?? P2-IR 无损下采样
  - [-1, 2, C3k2, [128, False, 0.25]]# 8: P2-IR-out
  - [-1, 1, SPDConv, [256]]          # 9: ?? P3-IR 无损下采样
  - [-1, 2, C3k2, [256, False, 0.25]]# 10: P3-IR-out

  # ================= 高级语义特征 =================
  - [5, 1, Conv, [512,3,2]]           # 11: ?? P4-Vis 无损下采样
  - [-1, 2, C3k2, [512, True]]       # 12: P4-Vis-out
  - [-1, 1, Conv, [768,3,2]]          # 13: ?? P5-Vis 无损下采样
  - [-1, 2, C3k2, [768, True]]       # 14: P5-Vis-out

  - [10, 1, Conv, [512,3,2]]          # 15: ?? P4-IR 无损下采样
  - [-1, 2, C3k2, [512, True]]       # 16: P4-IR-out
  - [-1, 1, Conv, [768,3,2]]          # 17: ?? P5-IR 无损下采样
  - [-1, 2, C3k2, [768, True]]       # 18: P5-IR-out

  # ================= AFIM 纯净光照融合 =================
  - [[5, 10], 1, AFIM, [256]]        # 19: 融合 P3 (80x80)
  - [[12, 16], 1, AFIM, [512]]       # 20: 融合 P4 (40x40)
  - [[14, 18], 1, AFIM, [768]]       # 21: 融合 P5 (20x20)

head:
  - [-1, 1, SPPF, [768, 5]]          # 22 (from 21)
  - [-1, 2, C2PSA, [768]]            # 23
  
  # === 自顶向下的 FPN ===
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 24: P5->P4
  - [[-1, 20], 1, Concat, [1]]       # 25: cat AFIM-P4
  - [-1, 2, C3k2_LSK, [512, False]]  # 26: 

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 27: P4->P3
  - [[-1, 19], 1, Concat, [1]]       # 28: cat AFIM-P3
  - [-1, 2, C3k2_LSK, [256, False]]  # 29: ?? P3 最终检测特征

  # === 自底向上的 PAN ===
  - [-1, 1, SPDConv, [256]]          # 30: ?? P3->P4 无损下采样
  - [[-1, 26], 1, Concat, [1]]       # 31: cat P4
  - [-1, 2, C3k2_LSK, [512, False]]  # 32: ?? P4 最终检测特征

  - [-1, 1, SPDConv, [512]]          # 33: ?? P4->P5 无损下采样
  - [[-1, 23], 1, Concat, [1]]       # 34: cat P5 顶层
  - [-1, 2, C3k2_LSK, [768, True]]   # 35: ?? P5 最终检测特征

  # === 恢复经典的 3 头检测 ===
  - [[29, 32, 35], 1, Detect, [nc]]  # 36: 挂载 P3, P4, P5 引脚