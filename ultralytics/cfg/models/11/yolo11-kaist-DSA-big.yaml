# YOLO11-RGBT-Expert (Head-Heavy + LSK + DSA + CoordConv)
nc: 1 
ch: 6 
scales:
  n: [0.50, 0.25, 1024] # 全局维持 0.3，骨干网络保持轻快

backbone:
  - [-1, 1, ChannelSplit, [3]]         # 0: [Vis, IR]
  - [0, 1, Conv, [32, 3, 2]]            # 1: P2-Vis
  - [-1, 1, C3k2, [32, False]]          # 2
  - [-1, 1, Conv, [64, 3, 2]]           # 3: P3-Vis
  - [-1, 1, C3k2, [64, False]]          # 4
  - [-1, 1, Conv, [128, 3, 2]]          # 5: P4-Vis
  - [-1, 1, C3k2, [128, False]]         # 6

  - [0, 1, Conv, [32, 3, 2]]            # 7: P2-IR
  - [-1, 1, C3k2, [32, False]]          # 8
  - [-1, 1, Conv, [64, 3, 2]]           # 9: P3-IR
  - [-1, 1, C3k2, [64, False]]          # 10
  - [-1, 1, Conv, [128, 3, 2]]          # 11: P4-IR
  - [-1, 1, C3k2, [128, False]]         # 12

  - [[2, 8], 1, IAW_Lite, [32]]          # 13: 融合 P2
  - [[4, 10], 1, CMFF_Module_Lite, [64]]  # 14: 融合 P3
  - [-1, 1, DSA, [3]]                   # 15: 对齐 P3
  - [[6, 12], 1, CMFF_Module, [128]]     # 16: 融合 P4
  - [-1, 1, DSA, [3]]                   # 17: 对齐 P4
  - [-1, 1, LSKBlock, []]                # 18: 全局感受野强化

head:
  - [-1, 1, SPPF, [128, 5]]             # 19
  - [-1, 1, C2PSA, [128]]               # 20
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']] 
  - [[-1, 15], 1, Concat, [1]]         # 22
  - [-1, 1, C3k2, [256, False]]         # 23: ?? P3 路径加宽 (256*0.3 ≈ 76通道)
  
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']] 
  - [[-1, 13], 1, Concat, [1]]         # 25
  - [-1, 1, C3k2, [160, False]]         # 26: ?? P2 小目标头加宽 (160*0.3 = 48实测通道)
  
  - [-1, 1, Conv, [64, 3, 2]]           # 27
  - [[-1, 23], 1, Concat, [1]]         # 28
  - [-1, 1, C3k2, [212, False]]         # 29: ?? P3 标准头加宽 (212*0.3 ≈ 64实测通道)
  
  - [-1, 1, Conv, [128, 3, 2]]          # 30
  - [[-1, 20], 1, Concat, [1]]         # 31
  - [-1, 1, CoordConv, [424, 1, 0]]        # 32: ?? CoordConv 配合更宽通道 (424*0.3 ≈ 128通道)
  - [-1, 1, C3k2, [424, False]]         # 33: ?? P4 大目标头加宽 (424*0.3 ≈ 128实测通道)

  - [[26, 29, 33], 1, Detect, [nc]]     # 34: 最终融合检测