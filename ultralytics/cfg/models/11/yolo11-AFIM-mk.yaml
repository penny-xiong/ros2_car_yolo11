# YOLO11-RGBT-Gate-AFIM (Target LLVIP mAP50: 0.98+)
# 奶奶的坚守版：早期模态门控去噪 (EarlyModalityGate) + 深度 AFIM 融合

nc: 1
ch: 6
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, ChannelSplit, [64]]      # 0: [Vis, IR]

  # ================= Stage 1: P1, P2 浅层特征提取 =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]  # 1: P1-Vis
  - [-1, 1, Conv, [128, 3, 2]]       # 2: P2-Vis 下采样
  - [-1, 2, C3k2, [128, False]]      # 3: P2-Vis-out

  - [0, 1, DSConv_RGBT, [64, 3, 2]]  # 4: P1-IR
  - [-1, 1, Conv, [128, 3, 2]]       # 5: P2-IR 下采样
  - [-1, 2, C3k2, [128, False]]      # 6: P2-IR-out

  # ================= ?? 核心接入：早期红外门控立交桥 =================
  # 接收 3(Vis) 和 6(IR)，利用红外门控清洗可见光，输出清洗后的列表 [Clean_Vis, Clean_IR]
  - [[3, 6], 1, EarlyModalityGate, [128]] # 7: P2 级别联合去噪

  # ================= Stage 2: 拿着干净的特征继续 P3 下采样 =================
  - [7, 1, SelectFromList, [0]]      # 8: 获取清洗后的 P2-Vis
  - [-1, 1, Conv, [256, 3, 2]]       # 9: P3-Vis 下采样 (现在用的是干净数据！)
  - [-1, 2, C3k2, [256, False]]      # 10: P3-Vis-out

  - [7, 1, SelectFromList, [1]]      # 11: 获取清洗后的 P2-IR
  - [-1, 1, Conv, [256, 3, 2]]       # 12: P3-IR 下采样 (现在用的是干净数据！)
  - [-1, 2, C3k2, [256, False]]      # 13: P3-IR-out

  # ================= Stage 3: P4 高级语义特征 =================
  - [10, 1, Conv, [512, 3, 2]]       # 14: P4-Vis 下采样
  - [-1, 2, C3k2, [512, True]]       # 15: P4-Vis-out

  - [13, 1, Conv, [512, 3, 2]]       # 16: P4-IR 下采样
  - [-1, 2, C3k2, [512, True]]       # 17: P4-IR-out

  # ================= Stage 4: P5 全局语义特征 =================
  - [15, 1, Conv, [768, 3, 2]]       # 18: P5-Vis 下采样
  - [-1, 2, C3k2, [768, True]]       # 19: P5-Vis-out

  - [17, 1, Conv, [768, 3, 2]]       # 20: P5-IR 下采样
  - [-1, 2, C3k2, [768, True]]       # 21: P5-IR-out

  # ================= 中后期并网：AFIM 跨模态选择性空间去噪中心 =================
  - [[10, 13], 1, AFIM, [256]]       # 22: 融合 P3 (80x80)
  - [[15, 17], 1, AFIM, [512]]       # 23: 融合 P4 (40x40)
  - [[19, 21], 1, AFIM, [768]]       # 24: 融合 P5 (20x20)

head:
  - [-1, 1, SPPF, [768, 5]]          # 25: (接收 AFIM P5 的输出)
  - [-1, 2, C2PSA, [768]]            # 26: 空间注意力
  
  # --- Neck 顶层自上而下特征对齐 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 27: P5 往 P4 上采样
  - [[-1, 23], 1, Concat, [1]]       # 28: 拼合 AFIM-P4 (层 23)
  - [-1, 2, C3k2_LSK, [512, False]]  # 29: 提炼

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 30: P4 往 P3 上采样
  - [[-1, 22], 1, Concat, [1]]       # 31: 拼合 AFIM-P3 (层 22)
  - [-1, 2, C3k2_LSK, [256, False]]  # 32: ?? 最终 P3 输出

  # --- Neck 自下而上强健回归 ---
  - [-1, 1, Conv, [256, 3, 2]]       # 33: 下采样 P3->P4
  - [[-1, 29], 1, Concat, [1]]       # 34: 拼合 FPN 的 P4
  - [-1, 2, C3k2_LSK, [512, False]]  # 35: ?? 最终 P4 输出

  - [-1, 1, Conv, [512, 3, 2]]       # 36: 下采样 P4->P5
  - [[-1, 26], 1, Concat, [1]]       # 37: 拼合顶层全局特征
  - [-1, 2, C3k2_LSK, [768, True]]   # 38: ?? 最终 P5 输出

  # --- 检测头 ---
  - [[32, 35, 38], 1, Detect, [nc]]  # 39: 挂载 P3, P4, P5