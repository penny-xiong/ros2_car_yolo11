# YOLO11-RGBT-Grandma-SuperLite (Under 2.2M Params & ~11.5 GFLOPs)
nc: 1  # LLVIP 类别数
ch: 6  # Visible + Infrared 双流输入
scales: 
  n: [1, 1, 1024] # 0.25 宽度缩放

# 1. 骨干网络 (Backbone)
backbone:
  # --- 0. 双流进门分流 ---
  - [-1, 1, ChannelSplit, [64]]      # 层 0: 输出 [Vis_feat, IR_feat]

  # ================= 可见光支路 (Visible Stream) =================
  - [0, 1, Conv, [64, 3, 2]]          # 层 1: P1-Vis (320x320)
  - [-1, 1, Conv, [128, 3, 2]]         # 层 2: P2-Vis (160x160)
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 3: 特征提取
  - [-1, 1, Conv, [256, 3, 2]]         # 层 4: P3-Vis (80x80)
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 5: 特征提取
  - [-1, 1, Conv, [512, 3, 2]]         # 层 6: P4-Vis (40x40)
  - [-1, 2, C3k2, [512, True]]         # 层 7: 特征提取
  - [-1, 1, Conv, [512, 3, 2]]         # 层 8: 👵 P5-Vis 对齐至 512 (20x20)
  - [-1, 2, C3k2, [512, True]]         # 层 9: 特征提取

  # ================= 红外光支路 (Infrared Stream) =================
  - [0, 1, Conv, [64, 3, 2]]          # 层 10: P1-IR (320x320)
  - [-1, 1, Conv, [128, 3, 2]]         # 层 11: P2-IR (160x160)
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 12: 特征提取
  - [-1, 1, Conv, [256, 3, 2]]         # 层 13: P3-IR (80x80)
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 14: 特征提取
  - [-1, 1, Conv, [512, 3, 2]]         # 层 15: P4-IR (40x40)
  - [-1, 2, C3k2, [512, True]]         # 层 16: 特征提取
  - [-1, 1, Conv, [512, 3, 2]]         # 层 17: 👵 P5-IR 对齐至 512 (20x20)
  - [-1, 2, C3k2, [512, True]]         # 层 18: 特征提取

  # ================= 核心融合节点 =================
  - [[5, 14], 1, IlluminationAwareWeight, [256]] # 层 19: 融合 P3 (80x80)
  - [[7, 16], 1, CMFF_Module, [512]]             # 层 20: 融合 P4 (40x40)
  - [[9, 18], 1, CMFF_Module, [512]]             # 层 21: 融合 P5 (20x20)

# 2. 检测头与特征融合网络 (Head)
head:
  - [-1, 1, SPPF, [512, 5]]             # 层 22 (P5/32, 20x20)
  - [-1, 2, C2PSA, [512]]               # 层 23 (P5/32, 20x20)

  # --- 第一轮融合：上采样到 P4 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 24 (40x40)
  - [[-1, 20], 1, Concat, [1]]          # 层 25: 结合层 20 (Fused P4)
  - [-1, 2, C3k2, [512, False]]          # 层 26

  # --- 第二轮融合：上采样到 P3 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 27 (80x80)
  - [[-1, 19], 1, Concat, [1]]          # 层 28: 结合层 19 (Fused P3)
  - [-1, 2, C3k2, [256, False]]          # 层 29 (P3 检测分支)

  # --- 第三轮下采样：回到 P4 ---
  - [-1, 1, Conv, [256, 3, 2]]          # 层 30 (40x40)
  - [[-1, 26], 1, Concat, [1]]          # 层 31: 与层 26 合并
  - [-1, 2, C3k2, [512, False]]          # 层 32 (P4 检测分支)

  # --- 第四轮下采样：回到 P5 ---
  - [-1, 1, Conv, [512, 3, 2]]          # 层 33 (20x20)
  - [[-1, 23], 1, Concat, [1]]          # 层 34: 与层 23 合并
  - [-1, 2, C3k2, [512, True]]           # 层 35 (P5 检测分支)

  # --- 检测输出 ---
  - [[29, 32, 35], 1, Detect, [nc]]     # 层 36: 最终检测 [P3, P4, P5]