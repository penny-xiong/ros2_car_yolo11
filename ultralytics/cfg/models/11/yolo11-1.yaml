nc: 1
ch: 6
scales:
  s: [0.5, 0.5, 1024]

backbone:
  - [-1, 1, ChannelSplit, [64]]      # 0: Output is [Vis, IR] list

  - [0, 1, SelectFromList, [0]]      # 1: Extract Vis tensor
  - [-1, 1, Conv, [64, 3, 2]]        # 2: P1-Vis
  - [-1, 1, Conv, [128, 3, 2]]       # 3: P2-Vis
  - [-1, 2, C3k2, [128, False, 0.25]]# 4: P2-Vis-out
  - [-1, 1, Conv, [256, 3, 2]]       # 5: P3-Vis
  - [-1, 2, C3k2, [256, False, 0.25]]# 6: P3-Vis-out

  - [0, 1, SelectFromList, [1]]      # 7: Extract IR tensor
  - [-1, 1, Conv, [64, 3, 2]]        # 8: P1-IR
  - [-1, 1, Conv, [128, 3, 2]]       # 9: P2-IR
  - [-1, 2, C3k2, [128, False, 0.25]]# 10: P2-IR-out
  - [-1, 1, Conv, [256, 3, 2]]       # 11: P3-IR
  - [-1, 2, C3k2, [256, False, 0.25]]# 12: P3-IR-out

  - [6, 1, Conv, [512, 3, 2]]        # 13: P4-Vis
  - [-1, 2, C3k2, [512, True]]       # 14: P4-Vis-out
  - [-1, 1, Conv, [768, 3, 2]]       # 15: P5-Vis
  - [-1, 2, C3k2, [768, True]]       # 16: P5-Vis-out

  - [12, 1, Conv, [512, 3, 2]]       # 17: P4-IR
  - [-1, 2, C3k2, [512, True]]       # 18: P4-IR-out
  - [-1, 1, Conv, [768, 3, 2]]       # 19: P5-IR
  - [-1, 2, C3k2, [768, True]]       # 20: P5-IR-out

  - [[6, 12], 1, Concat, [1]]        # 21: Naive Concat P3
  - [-1, 1, Conv, [256, 1, 1]]       # 22: P3-Fused

  - [[14, 18], 1, Concat, [1]]       # 23: Naive Concat P4
  - [-1, 1, Conv, [512, 1, 1]]       # 24: P4-Fused

  - [[16, 20], 1, Concat, [1]]       # 25: Naive Concat P5
  - [-1, 1, Conv, [768, 1, 1]]       # 26: P5-Fused

head:
  - [-1, 1, SPPF, [768, 5]]          # 27
  - [-1, 2, C2PSA, [768]]            # 28

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 29
  - [[-1, 24], 1, Concat, [1]]       # 30: Concat with P4-Fused
  - [-1, 2, C3k2, [512, False]]      # 31

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 32
  - [[-1, 22], 1, Concat, [1]]       # 33: Concat with P3-Fused
  - [-1, 2, C3k2, [256, False]]      # 34: Detect P3 Head

  - [-1, 1, Conv, [256, 3, 2]]       # 35
  - [[-1, 31], 1, Concat, [1]]       # 36
  - [-1, 2, C3k2, [512, False]]      # 37: Detect P4 Head

  - [-1, 1, Conv, [512, 3, 2]]       # 38
  - [[-1, 28], 1, Concat, [1]]       # 39
  - [-1, 2, C3k2, [768, True]]       # 40: Detect P5 Head

  - [[34, 37, 40], 1, Detect, [nc]]  # 41