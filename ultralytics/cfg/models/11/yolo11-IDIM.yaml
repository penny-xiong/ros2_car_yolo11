# YOLO11-RGBT: SPDConv + IDIM + TC-SSM 
nc: 1
ch: 6

scales: 
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, ChannelSplit, [64]]  # [0]

  # --------- VIS Stream ---------
  - [0, 1, SelectFromList, [0]]  # [1]
  - [-1, 1, Conv, [64, 3, 2]]    # [2]
  - [-1, 1, SPDConv, [128, 3, 2]] # [3] 创新1：SPD 保护低光特征
  - [-1, 2, C3k2, [128, False, 0.25]] # [4]
  - [-1, 1, Conv, [256, 3, 2]]   # [5]
  - [-1, 2, C3k2, [256, False, 0.25]] # [6] VIS P3

  # --------- IR Stream ---------
  - [0, 1, SelectFromList, [1]]  # [7]
  - [-1, 1, Conv, [64, 3, 2]]    # [8]
  - [-1, 1, SPDConv, [128, 3, 2]] # [9]
  - [-1, 2, C3k2, [128, False, 0.25]] # [10]
  - [-1, 1, Conv, [256, 3, 2]]   # [11]
  - [-1, 2, C3k2, [256, False, 0.25]] # [12] IR P3

  # --------- Deep Backbone ---------
  - [6, 1, Conv, [512, 3, 2]]    # [13] VIS P4
  - [-1, 2, C3k2, [512, True]]   # [14] 
  - [12, 1, Conv, [512, 3, 2]]   # [15] IR P4
  - [-1, 2, C3k2, [512, True]]   # [16] 

  - [14, 1, Conv, [768, 3, 2]]   # [17] VIS P5
  - [-1, 2, C3k2, [768, True]]   # [18]
  - [16, 1, Conv, [768, 3, 2]]   # [19] IR P5
  - [-1, 2, C3k2, [768, True]]   # [20]

  # ================= 创新2：非对称细节注入融合 =================
  # 务必注意顺序：前面是 VIS，后面是 IR。网络将以 IR 为主导！
  - [[6, 12], 1, IDIM, [256]]    # [21] 融合 P3
  - [[14, 16], 1, IDIM, [512]]   # [22] 融合 P4
  # 深层 P5 放弃 VIS 的噪点干扰，直接提取 IR 的纯净语义
  - [20, 1, Conv, [768, 1, 1]]   # [23] 纯红外 P5

head:
  - [23, 1, SPPF, [768, 5]]      # [24]
  # ================= 创新3：状态空间热力上下文 =================
  - [-1, 2, C2_TC_SSM, [768]]    # [25] 替换 C2PSA，线性全局扫描

  # --------- Neck Top-Down ---------
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]] # [26] 恢复双线性，拯救 FPS
  - [[-1, 22], 1, Concat, [1]]   # [27]
  - [-1, 2, C3k2, [512, False]]  # [28] P4

  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]] # [29]
  - [[-1, 21], 1, Concat, [1]]   # [30]
  - [-1, 2, C3k2, [256, False]]  # [31] P3 (Small Detect)

  # --------- Neck Bottom-Up ---------
  - [-1, 1, Conv, [256, 3, 2]]   # [32]
  - [[-1, 28], 1, Concat, [1]]   # [33]
  - [-1, 2, C3k2, [512, False]]  # [34] P4 (Medium Detect)

  - [-1, 1, Conv, [512, 3, 2]]   # [35]
  - [[-1, 25], 1, Concat, [1]]   # [36]
  - [-1, 2, C3k2, [768, True]]   # [37] P5 (Large Detect)

  - [[31, 34, 37], 1, Detect, [nc]]  # [38] YOLO11 官方检测头