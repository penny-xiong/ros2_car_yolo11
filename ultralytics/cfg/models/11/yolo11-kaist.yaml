# YOLO11-RGBT-Lite-KAIST (Specialized for Small Objects & Misalignment)
nc: 1 
ch: 6 
scales:
  # n 尺度：保持 0.25 宽度以维持极轻量化 (约 35万参数)
  n: [0.50, 0.25, 1024] 

backbone:
  - [-1, 1, ChannelSplit, [3]]        # 0: 分流 [Vis, IR]

  # === 可见光支路 (Visible) ===
  - [0, 1, Conv, [32, 3, 2]]           # 1: P2-Vis
  - [-1, 1, C3k2, [32, False]]         # 2
  - [-1, 1, Conv, [64, 3, 2]]          # 3: P3-Vis
  - [-1, 1, C3k2, [64, False]]         # 4
  - [-1, 1, Conv, [128, 3, 2]]         # 5: P4-Vis
  - [-1, 1, C3k2, [128, False]]        # 6

  # === 红外光支路 (Infrared) ===
  - [0, 1, Conv, [32, 3, 2]]           # 7: P2-IR
  - [-1, 1, C3k2, [32, False]]         # 8
  - [-1, 1, Conv, [64, 3, 2]]          # 9: P3-IR
  - [-1, 1, C3k2, [64, False]]         # 10
  - [-1, 1, Conv, [128, 3, 2]]         # 11: P4-IR
  - [-1, 1, C3k2, [128, False]]        # 12

  # === 融合与空间对齐层 ===
  - [[2, 8], 1, IAW_Lite, [32]]         # 13: 融合 P2 (高分辨率，小目标核心)
  - [[4, 10], 1, CMFF_Module_Lite, [64]] # 14: 融合 P3
  - [-1, 1, SpatialAttention_Lite, []]   # 15: P3 SSA 平滑 (解决位移)
  - [[6, 12], 1, CMFF_Module, [128]]    # 16: 融合 P4
  - [-1, 1, SpatialAttention_Lite, []]   # 17: P4 SSA 平滑 (解决位移)
  
  # === 注意力增强 ===
  - [-1, 1, EMA, [4]]                   # 18: 全局特征强化

head:
  - [-1, 1, SPPF, [128, 5]]            # 19
  - [-1, 1, C2PSA, [128]]              # 20

  # --- 特征聚合网络 (向上采样，锁定小目标) ---
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']] # 21
  - [[-1, 15], 1, Concat, [1]]        # 22: 融合 P3 (对齐 SSA 输出)
  - [-1, 1, C3k2, [128, False]]        # 23
  
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']] # 24
  - [[-1, 13], 1, Concat, [1]]        # 25: 融合 P2 (直接对接底层融合层)
  - [-1, 1, C3k2, [64, False]]         # 26: << 检测分支 1 (P2, 针对极小目标) >>
  
  # --- 特征聚合网络 (向下采样，增强定位) ---
  - [-1, 1, Conv, [64, 3, 2]]          # 27
  - [[-1, 23], 1, Concat, [1]]        # 28
  - [-1, 1, C3k2, [128, False]]        # 29: << 检测分支 2 (P3, 针对中等目标) >>
  
  - [-1, 1, Conv, [128, 3, 2]]         # 30
  - [[-1, 20], 1, Concat, [1]]        # 31
  - [-1, 1, C3k2, [256, False]]        # 32: << 检测分支 3 (P4, 针对大目标) >>

  # --- 最终检测头 ---
  - [[26, 29, 32], 1, Detect, [nc]]    # 33: 最终输出索引