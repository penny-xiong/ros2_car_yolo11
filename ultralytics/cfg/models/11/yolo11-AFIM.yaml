# Ultralytics YOLO ??, AGPL-3.0 license
# YOLO11-RGBT-AFIM-SOTA-v4 (Target LLVIP mAP50: 0.98+)

# Parameters
nc: 1 # LLVIP 数据集仅有行人类别 (pedestrian)
ch: 6 # ?? 核心：双模态输入，前3通道可见光(RGB)，后3通道红外(IR)

# Scale gains (基于标准的 YOLOv11s 架构容量配比)
scales:
  # [depth, width, max_channels]
  s: [0.5, 0.5, 1024]

# YOLO11-RGBT 双流独立主干 + AFIM 中后期并网降噪
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ChannelSplit, [64]]      # 层 0: 将6通道输入切分为 [Vis_3ch, IR_3ch]

  # ================= 可见光 (Visible) 独立表征支路 =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]    # 层 1: P1-Vis (浅层自适应变形采样)
  - [-1, 1, Conv, [128, 3, 2]]         # 层 2: P2-Vis下采样
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 3: P2-Vis特征提炼
  - [-1, 1, Conv, [256, 3, 2]]         # 层 4: P3-Vis下采样
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 5: P3-Vis-输出端 (80x80)

  # ================= 红外光 (Infrared) 连续能流支路 =================
  - [0, 1, DSConv_RGBT, [64, 3, 2]]    # 层 6: P1-IR (红外浅层自适应变形采样)
  - [-1, 1, Conv, [128, 3, 2]]         # 层 7: P2-IR下采样
  - [-1, 2, C3k2, [128, False, 0.25]]  # 层 8: P2-IR特征提炼
  - [-1, 1, Conv, [256, 3, 2]]         # 层 9: P3-IR下采样
  - [-1, 2, C3k2, [256, False, 0.25]]  # 层 10: P3-IR-输出端 (80x80)

  # ================= 极浅层红外门控立交桥 =================
  - [[3, 8], 1, EarlyModalityGate, [128]] # 层 11: 浅层快速清洗可见光噪声

  # ================= 高级语义特征独立下采样 =================
  - [5, 1, Conv, [512, 3, 2]]          # 层 12: P4-Vis下采样
  - [-1, 2, C3k2, [512, True]]         # 层 13: P4-Vis-输出端 (40x40)
  - [-1, 1, Conv, [768, 3, 2]]         # 层 14: P5-Vis下采样
  - [-1, 2, C3k2, [768, True]]         # 层 15: P5-Vis-输出端 (20x20)

  - [10, 1, Conv, [512, 3, 2]]         # 层 16: P4-IR下采样
  - [-1, 2, C3k2, [512, True]]         # 层 17: P4-IR-输出端 (40x40)
  - [-1, 1, Conv, [768, 3, 2]]         # 层 18: P5-IR下采样
  - [-1, 2, C3k2, [768, True]]         # 层 19: P5-IR-输出端 (20x20)

  # ================= ?? 核心并网：AFIM 跨模态选择性空间去噪中心 =================
  - [[5, 10], 1, AFIM, [256]]          # 层 20: 纯净融合 P3 尺度空间 (80x80)
  - [[13, 17], 1, AFIM, [512]]         # 层 21: 纯净融合 P4 尺度空间 (40x40)
  - [[15, 19], 1, AFIM, [768]]         # 层 22: 纯净融合 P5 尺度空间 (20x20)

# YOLO11 强力特征融合 Neck 与多尺度大核感知头
head:
  - [-1, 1, SPPF, [768, 5]]              # 层 23: 空间金字塔池化
  - [-1, 2, C2PSA, [768]]                # 层 24: 引入空间自注意力机制
  
  # --- Neck 顶层自上而下特征对齐通道 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 25: P5 往 P4 上采样
  - [[-1, 21], 1, Concat, [1]]          # 层 26: 拼合 AFIM 纯净化的 P4 特征
  - [-1, 2, C3k2_LSK, [512, False]]     # 层 27: 空间核感知

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 层 28: P4 往 P3 上采样
  - [[-1, 20], 1, Concat, [1]]          # 层 29: 拼合 AFIM 纯净化的 P3 特征
  - [-1, 2, C3k2_LSK, [256, False]]     # 层 30: 获得纯净的多尺度 P3 输出

  # --- Neck 自下而上强健回归通道 ---
  - [-1, 1, Conv, [256, 3, 2]]          # 层 31: 下采样
  - [[-1, 27], 1, Concat, [1]]          # 层 32: 拼合
  - [-1, 2, C3k2_LSK, [512, False]]     # 层 33: 获得纯净的多尺度 P4 输出

  - [-1, 1, Conv, [512, 3, 2]]          # 层 34: 下采样
  - [[-1, 24], 1, Concat, [1]]          # 层 35: 拼合顶层全局特征
  - [-1, 2, C3k2_LSK, [768, True]]      # 层 36: 获得纯净的多尺度 P5 输出

  # --- 检测头解耦输出 ---
  - [[30, 33, 36], 1, Detect, [nc]]     # 层 37: 挂载 P3, P4, P5 检测引脚