# YOLO11-RGBT-Expert (LSK + DSA + CoordConv)
nc: 1 
ch: 6 
scales:
  n: [0.50, 0.25, 1024] # ?? 宽度稍微提到 0.3，计算量控制在 20 左右

backbone:
  - [-1, 1, ChannelSplit, [3]]         # 0: [Vis, IR]
  - [0, 1, Conv, [32, 3, 2]]            # 1: P2-Vis
  - [-1, 1, C3k2, [32, False]]          # 2
  - [-1, 1, Conv, [64, 3, 2]]           # 3: P3-Vis
  - [-1, 1, C3k2, [64, False]]          # 4
  - [-1, 1, Conv, [128, 3, 2]]          # 5: P4-Vis
  - [-1, 1, C3k2, [128, False]]         # 6

  - [0, 1, Conv, [32, 3, 2]]            # 7: P2-IR
  - [-1, 1, C3k2, [32, False]]          # 8
  - [-1, 1, Conv, [64, 3, 2]]           # 9: P3-IR
  - [-1, 1, C3k2, [64, False]]          # 10
  - [-1, 1, Conv, [128, 3, 2]]          # 11: P4-IR
  - [-1, 1, C3k2, [128, False]]         # 12

  - [[2, 8], 1, IAW_Lite, [32]]          # 13: 融合 P2
  - [[4, 10], 1, CMFF_Module_Lite, [64]]  # 14: 融合 P3
  - [-1, 1, DSA, [3]] # 15: DSA 对齐
  - [[6, 12], 1, CMFF_Module, [128]]     # 16: 融合 P4
  - [-1, 1, DSA, [3]] # 17: DSA 对齐
  - [-1, 1, LSKBlock, []]                # 18: ?? 换成 LSK 捕获小目标

head:
  - [-1, 1, SPPF, [128, 5]]             # 19
  - [-1, 1, C2PSA, [128]]               # 20
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']] 
  - [[-1, 15], 1, Concat, [1]]         # 22
  - [-1, 1, C3k2, [128, False]]         # 23
  - [-1, 1, nn.Upsample, [null, 2, 'nearest']] 
  - [[-1, 13], 1, Concat, [1]]         # 25
  - [-1, 1, C3k2, [64, False]]          # 26: P2 检测分支
  
  - [-1, 1, Conv, [64, 3, 2]]           # 27
  - [[-1, 23], 1, Concat, [1]]         # 28
  - [-1, 1, C3k2, [128, False]]         # 29: P3 检测分支
  
  - [-1, 1, Conv, [128, 3, 2]]          # 30
  - [[-1, 20], 1, Concat, [1]]         # 31
  - [-1, 1, CoordConv, [256, 1, 0]]        # 32: ?? 在大目标分支加 CoordConv 强化坐标感知
  - [-1, 1, C3k2, [256, False]]         # 33

  - [[26, 29, 33], 1, Detect, [nc]]     # 34: 最终检测